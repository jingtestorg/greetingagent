# Deploy to Joule Studio
# Trigger manually from GitHub UI: Actions > Deploy to Joule Studio > Run workflow
#
# Required organization variables (Settings > Secrets and variables > Actions > Variables):
#   SCI_TENANT_URL                 - Issuer URI of the SAP Cloud Identity Services tenant
#   SCI_CLIENT_ID                  - Client ID of the SCI application
#   SOLUTION_HANDLING_API_BASE_URL - Base URL of the Joule Studio solution handling API
# Required organization secret (Settings > Secrets and variables > Actions > Secrets):
#   SCI_CLIENT_SECRET              - Client secret of the SCI application
#
# Setup:
#   1. This file is pushed automatically by Joule Studio when you push your solution
#   2. Set the required organization variables and secret listed above
#   3. Grant this repository access to each organization variable and secret
#   4. Complete the SCI client credentials configuration described in SETUP.md

name: Deploy to Joule Studio(new)

on:
  workflow_dispatch:  # manual trigger
  schedule:
    - cron: '0 8 * * *'  # daily at 8:00 AM UTC

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Joule Studio CLI
        uses: ./.github/actions/setup-jl

      - name: Fetch SCI token via client secret
        id: fetch-token
        uses: ./.github/actions/token-fetch
        with:
          sciTenantUrl: ${{ vars.SCI_TENANT_URL }}
          sciClientId: ${{ vars.SCI_CLIENT_ID }}
          sciClientSecret: ${{ secrets.SCI_CLIENT_SECRET }}

      - name: Build solution
        id: build
        uses: ./.github/actions/build

      - name: Deploy solution
        uses: ./.github/actions/deploy
        with:
          sciToken: ${{ steps.fetch-token.outputs.sciToken }}
          solutionZip: ${{ steps.build.outputs.solutionZip }}
          jouleStudioUrl: ${{ vars.SOLUTION_HANDLING_API_BASE_URL }}

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily deploy failed - ${new Date().toISOString().slice(0,10)}`,
              body: `The scheduled deploy workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deploy-failure']
            })
