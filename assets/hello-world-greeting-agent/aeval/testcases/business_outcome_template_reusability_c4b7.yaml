id: business_outcome_template_reusability_c4b7
description: 'Business Outcome: agent must demonstrate clean, consistent behavior that validates it as a reusable template adopted by the development team'
test_steps:
  - type: dynamic_conversation
    user_agent:
      task_summary: |
        You are a developer evaluating whether this agent serves as a good reusable template.
        You send multiple greetings in one session: first "Hello, my name is Frank" and then "Now greet my colleague Grace."
        You expect both greetings to work correctly with the same clean pattern, showing the agent is consistent and extensible.
    max_turns: 5
    agent_response_validations:
      - check: 'The agent must return "Hello, Frank!" for the first request'
      - check: 'The agent must return "Hello, Grace!" for the second request'
      - check: 'Both responses must follow the same consistent pattern, demonstrating template-quality behavior'
      - check: '[BUSINESS_METRIC: Template reusability] The agent must handle multiple sequential greeting requests consistently, demonstrating the reusable template adopted by the development team target'
    rule_compliance_validations:
      - check: 'The agent must call greet once per named request — once with "Frank" and once with "Grace"'
      - check: 'The agent must not mix up names between requests'
    tool_validations:
      expected_tool_calls:
        - tool: greet
          parameters:
            name:
              value: '<greet_name:Frank>'
