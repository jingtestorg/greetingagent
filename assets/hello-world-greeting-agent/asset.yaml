apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: hello-world-greeting-agent
  version: "1.0.0"

agentCard:
  name: hello-world-greeting-agent
  version: "1.0.0"
  description: "A simple greeting agent that greets users by name"
  capabilities:
    skills:
      - name: greet
        description: Greet a user by name and return a personalized greeting message

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: hello-world-greeting-agent
      kind: a2a
      ordId: customer.build:apiResource:hello-world-greeting-ca915.hello-world-greeting-agent:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
